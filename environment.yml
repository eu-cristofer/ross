# environment.yml

name: rs
# To create the environment, run:
#   mamba env create -f environment.yml
# To update the environment, run:
#   mamba env update -f environment.yml --prune


dependencies:
  # Core language
  - python=3.12

  # Base scientific stack
  - numpy<=2.3
  - pandas
  - scipy
  - pint

  # Plotting & visualization
  - matplotlib
  - plotly

  # Jupyter ecosystem
  - ipykernel
  - ipython
  - jupyter
  - ipywidgets
  - nbconvert
  - nb_conda_kernels

  # Excel I/O
  - xlrd

  # Pip for PyPI installs
  - pip